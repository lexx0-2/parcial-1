name: Application checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run application regression tests
        run: python -m unittest discover -s tests -v
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Flask application
        run: |
          python app.py > /tmp/parcial-app.log 2>&1 &
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/parcial-app.log
          exit 1
      - name: Verify rendered 2D and 3D graphs in Chromium
        run: node tests/browser_visual_smoke.mjs
