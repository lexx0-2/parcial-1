{% extends "base.html" %}{% block content %}<section class="content-card"><span class="number">Módulo {{ number }}</span><h2>{{ title }}</h2><p>{{ theory }}</p><div class="formula">\[{{ formula }}\]</div><p>{{ explanation }}</p></section><section class="content-card"><h3>Calculadora interactiva</h3><div class="controls"><label>Función f(x)<input id="expr" value="{{ default_expr }}"></label><label>Límite inferior a<input id="a" type="number" step="any" value="0"></label><label>Límite superior b<input id="b" type="number" step="any" value="2"></label><button onclick="calculate()">Calcular</button></div>{{ extra|safe }}<div id="result" class="result-panel">Introduce los datos y pulsa calcular.</div><div id="plot" class="plot"></div></section><section class="content-card"><h3>Ejemplos resueltos</h3>{% for e in examples %}<div class="example">{{ e|safe }}</div>{% endfor %}</section><script>
async function calculate(){const box=document.getElementById("result");box.textContent="Calculando...";try{let e=expr.value,A=Number(a.value),B=Number(b.value),p=await processFormula(e),q=await integrateFormula(e,A,B);box.innerHTML="<b>Integral definida:</b><div class='formula'>\\["+q.latex+"\\]</div><p>Valor aproximado: "+Number(q.numeric).toPrecision(12)+"</p><p>Primitiva: \\["+p.antiderivative_latex+"+C\\]</p>";let X=makeX(A,B),v=await sampleFormula(e,X);Plotly.newPlot("plot",[{x:X,y:v.y,mode:"lines",name:"f(x)"},{x:X,y:v.y,fill:"tozeroy",mode:"none",name:"Área"}],{title:"Visualización de f(x)"});renderFormula()}catch(err){box.innerHTML="<p class='error'>"+err.message+"</p>"}}
async function calculateVolume(){try{let A=Number(a.value),B=Number(b.value),f=expr.value,g;if({{ number }}===13){let s=document.getElementById("shape").value;g=s==="square"?"("+f+")^2":s==="semicircle"?"pi*("+f+")^2/8":"sqrt(3)*("+f+")^2/4"}else{let m=document.getElementById("method").value;g=m==="shell"?"2*pi*x*("+f+")":m==="washer"?"pi*(("+f+")^2-("+document.getElementById("inner").value+")^2)":"pi*("+f+")^2"}let q=await integrateFormula(g,A,B);result.innerHTML="<b>Planteamiento:</b><div class='formula'>\\[V=\\int_"+A+"^"+B+"("+g+")dx\\]</div><p>Volumen = "+Number(q.numeric).toPrecision(12)+" unidades cúbicas</p>";renderFormula()}catch(err){result.innerHTML="<p class='error'>"+err.message+"</p>"}}
</script>{% endblock %}
